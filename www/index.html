<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="manifest.webmanifest">
<title>جعبه لایتنر</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2430;--mu:#6b7686;--pr:#1e3a5f;--ok:#1f9d55;--no:#d64545;--bd:#dde3ec}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a222d;--tx:#e8edf3;--mu:#93a0b2;--pr:#5b8fd6;--bd:#2b3644}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Vazirmatn,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--pr);color:#fff;padding:14px 16px;font-size:18px;font-weight:bold}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mu);font:inherit;font-size:14px;border-bottom:3px solid transparent}
nav button.on{color:var(--pr);border-color:var(--pr);font-weight:bold}
main{padding:14px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;text-align:center}
.en{font-size:32px;font-weight:bold;direction:ltr;word-break:break-word}
.ph{direction:ltr;color:var(--mu);font-size:18px;margin-top:8px}
.m{font-size:22px;margin-top:10px}.m2{font-size:19px;color:var(--mu)}
.sess{color:var(--mu);font-size:12px;margin-top:12px}
.row{display:flex;gap:10px;margin-top:14px}
button.b{flex:1;padding:15px;border:0;border-radius:12px;font:inherit;font-size:17px;color:#fff;background:var(--pr)}
button.ok{background:var(--ok)}button.no{background:var(--no)}button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.sp{background:none;border:0;font-size:26px;margin-top:6px}
textarea,input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
textarea{height:170px;direction:ltr;font-size:13px}
.stat{display:flex;gap:6px;margin:10px 0}.stat div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 2px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--pr)}.stat span{font-size:11px;color:var(--mu)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--bd);background:var(--card)}
.li .en{font-size:16px;font-weight:600}.li small{color:var(--mu)}
.hint{color:var(--mu);font-size:13px;line-height:1.8}.msg{margin-top:10px;color:var(--ok);font-size:14px}
label{font-size:14px;color:var(--mu)}
</style>
</head>

const KEY='leitner_v1', DAY=86400000, GAP=[0,1,2,4,8,16];
let S=load(), tab='study', cur=null, shown=false, msg='';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cards)return s}catch(e){}
 return {cards:SEED.map(mk),newLimit:20,day:'',newToday:0}}
function mk(a){return {w:a[0],m1:a[1]||'',m2:a[2]||'',p:a[3]||'',s:a[4]||'',box:0,due:0,seen:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
function rollDay(){if(S.day!==today()){S.day=today();S.newToday=0}}
function queue(){rollDay();const n=Date.now();
 const due=S.cards.filter(c=>c.seen&&c.due<=n).sort((a,b)=>a.box-b.box||a.due-b.due);
 let room=Math.max(0,S.newLimit-S.newToday);
 const nw=S.cards.filter(c=>!c.seen).slice(0,room);
 return {due,nw}}
function next(){const q=queue();cur=q.due[0]||q.nw[0]||null;shown=false}
function answer(ok){if(!cur)return;
 if(!cur.seen){cur.seen=true;S.newToday++}
 cur.box=ok?Math.min(5,cur.box+1):1;
 cur.due=Date.now()+GAP[cur.box]*DAY;
 if(cur.box===1&&!ok)cur.due=Date.now()+60000;
 save();next();render()}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function parse(txt){
 const out=[];
 for(let line of txt.split(/\r?\n/)){
  if(!line.trim())continue;
  let p=line.includes('\t')?line.split('\t'):line.split('|');
  p=p.map(x=>x.trim());
  if(p[0]==='لغت'||p[0].toLowerCase()==='word')continue;
  let a;
  if(p.length>=6)a=[p[0],p[2],p[3],p[4],p[5]];      // قالب اکسل: لغت، فاصله، معنی اول، معنی دوم، تلفظ، جلسه
  else a=[p[0],p[1],p[2],p[3],p[4]];                   // قالب کوتاه: لغت، معنی اول، معنی دوم، تلفظ، جلسه
  if(a[0])out.push(a)}
 return out}
function addWords(){
 const rows=parse(document.getElementById('ta').value);
 const have=new Set(S.cards.map(c=>c.w.toLowerCase()));let add=0,dup=0;
 for(const r of rows){if(have.has(r[0].toLowerCase())){dup++;continue}have.add(r[0].toLowerCase());S.cards.push(mk(r));add++}
 save();msg=add+' لغت اضافه شد'+(dup?' ('+dup+' لغت تکراری رد شد)':'');
 if(add)document.getElementById('ta').value='';render()}
function stats(){const n=Date.now(),b=[0,0,0,0,0,0,0];
 S.cards.forEach(c=>{if(!c.seen)b[0]++;else b[c.box]++});
 const due=S.cards.filter(c=>c.seen&&c.due<=n).length;return {b,due}}
function render(){
 const T=[['study','مرور'],['add','افزودن'],['list','لغات'],['stats','آمار']];
 nav.innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';msg='';render()">${t[1]}</button>`).join('');
 const v=document.getElementById('v');
 if(tab==='study'){
  if(!cur||!S.cards.includes(cur))next();
  if(!cur){v.innerHTML='<div class="card"><div class="m">🎉 مرور امروز تمام شد</div><p class="hint">لغت جدیدی برای امروز نمانده و کارت‌های جعبه هم هنوز موعد مرورشان نرسیده. می‌توانید در بخش «آمار» سقف لغات جدید روزانه را زیاد کنید.</p></div>';return}
  const c=cur,q=queue();
  v.innerHTML=`<div class="card"><div class="en">${esc(c.w)}</div>
  <button class="sp" onclick="speak(cur.w)">🔊</button>
  ${shown?`<div class="ph">${esc(c.p)}</div><div class="m">${esc(c.m1)}</div>${c.m2?`<div class="m m2">${esc(c.m2)}</div>`:''}`:''}
  <div class="sess">${c.seen?'جعبه '+c.box:'لغت جدید'} · موعد‌دار: ${q.due.length} · جدید: ${q.nw.length}${c.s?' · '+esc(c.s):''}</div></div>
  <div class="row">${shown?'<button class="b no" onclick="answer(false)">نمی‌دانستم</button><button class="b ok" onclick="answer(true)">می‌دانستم</button>':'<button class="b" onclick="shown=true;render()">ترجمه</button>'}</div>`;
 }else if(tab==='add'){
  v.innerHTML=`<p class="hint">ردیف‌ها را مستقیم از اکسل کپی کنید و اینجا بچسبانید (ستون‌ها با Tab جدا می‌شوند).<br>
  قالب اکسل: <b>لغت | فاصله | معنی اول | معنی دوم | تلفظ | جلسه</b><br>قالب کوتاه (۴–۵ ستون): <b>لغت | معنی اول | معنی دوم | تلفظ | جلسه</b><br>سطر عنوان و لغات تکراری خودکار نادیده گرفته می‌شوند.</p>
  <textarea id="ta" placeholder="achieve&#9;&#9;دست یافتن&#9;محقق کردن&#9;/əˈtʃiːv/&#9;01.pdf"></textarea>
  <div class="row"><button class="b" onclick="addWords()">افزودن به جعبه</button></div><div class="msg">${msg}</div>`;
 }else if(tab==='list'){
  v.innerHTML=`<input id="q" placeholder="جستجو..." oninput="flt()"><div id="lst"></div>`;flt();
 }else{
  const st=stats();
  v.innerHTML=`<div class="stat"><div><b>${st.b[0]}</b><span>جدید</span></div>${[1,2,3,4,5].map(i=>`<div><b>${st.b[i]}</b><span>جعبه ${i}</span></div>`).join('')}</div>
  <p class="hint">کل لغات: ${S.cards.length} · موعد مرور: ${st.due}</p>
  <label>سقف لغات جدید در هر روز</label><input type="number" min="1" value="${S.newLimit}" onchange="S.newLimit=Math.max(1,+this.value||20);save()">
  <p class="hint">پشتیبان‌گیری: متن زیر را کپی کنید تا پیشرفت شما نگه‌داری شود؛ برای بازیابی، آن را در کادر بچسبانید.</p>
  <textarea id="bk" style="height:90px"></textarea>
  <div class="row"><button class="b g" onclick="bk.value=JSON.stringify(S);bk.select();try{document.execCommand('copy')}catch(e){}">گرفتن پشتیبان</button><button class="b g" onclick="rest()">بازیابی</button></div>
  <div class="row"><button class="b no" onclick="if(confirm('همهٔ پیشرفت صفر شود؟')){S.cards.forEach(c=>{c.box=0;c.due=0;c.seen=false});save();cur=null;render()}">صفر کردن پیشرفت</button></div>`;
 }}
function flt(){const q=(document.getElementById('q').value||'').toLowerCase();
 lst.innerHTML=S.cards.map((c,i)=>[c,i]).filter(x=>!q||x[0].w.toLowerCase().includes(q)||x[0].m1.includes(q)).slice(0,150).map(x=>
 `<div class="li"><div><div class="en">${esc(x[0].w)}</div><small>${esc(x[0].m1)}${x[0].m2?' ، '+esc(x[0].m2):''}</small></div><button class="b g" style="flex:none;padding:6px 10px" onclick="delW(${x[1]})">حذف</button></div>`).join('')}
function delW(i){if(confirm('این لغت حذف شود؟')){S.cards.splice(i,1);save();cur=null;flt()}}
function rest(){try{const o=JSON.parse(bk.value);if(o&&o.cards){S=o;save();cur=null;alert('بازیابی شد');render()}}catch(e){alert('متن پشتیبان معتبر نیست')}}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
